<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة - منشر</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        const session = Auth.requireRole('admin');

        function renderApp() {
            const html = `
                ${renderHeader('لوحة تحكم الإدارة', 'إدارة المخزون والمندوبين والمصنع')}
                <main class="container">
                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchTab('dashboard-tab', 'admin-tabs'); loadDashboard()">لوحة التحكم</button>
                        <button class="tab-btn" onclick="switchTab('region-custody-tab', 'admin-tabs'); loadRegionCustody()">لوحة عهد المناطق</button>
                        <button class="tab-btn" onclick="switchTab('inventory-reg-tab', 'admin-tabs'); loadInventoryAdjustment()">تعديل المخزون</button>
                        <button class="tab-btn" onclick="switchTab('needs-tab', 'admin-tabs'); loadNeeds()">تسجيل الاحتياجات</button>
                        <button class="tab-btn" onclick="switchTab('inventory-tab', 'admin-tabs'); loadInventory()">متابعة المخزون</button>
                        <button class="tab-btn" onclick="switchTab('delegates-tab', 'admin-tabs'); loadDelegates()">متابعة الفرز</button>
                        <button class="tab-btn" onclick="switchTab('delegate-report-tab', 'admin-tabs'); loadDelegateReportTab()">تقارير المناديب</button>
                        <button class="tab-btn" onclick="switchTab('logs-tab', 'admin-tabs'); loadLogs()">سجل العمليات</button>
                        <button class="tab-btn" onclick="switchTab('settings-tab', 'admin-tabs'); loadSettings()">إعدادات النظام</button>
                        <button class="tab-btn" onclick="switchTab('assignment-tab', 'admin-tabs'); loadAssignments()">إسناد طلبية</button>
                        <button class="tab-btn" onclick="switchTab('financial-tracking-tab', 'admin-tabs'); loadFinancialTracking()">متابعة مالية</button>
                        <button class="tab-btn" onclick="switchTab('extra-stats-tab', 'admin-tabs'); loadExtraStats()">إحصائيات العهدة</button>
                    </div>

                    <div id="dashboard-tab" class="tab-content admin-tabs active">
                        <div class="help-box">هذه اللوحة تعرض ملخص شامل لحالة المخزون والعمليات</div>
                        <div style="margin-bottom: 15px;">
                            <button class="btn btn-primary" onclick="loadDashboard()">تحديث البيانات</button>
                        </div>
                        <div id="dashboard-content"></div>
                    </div>

                    <div id="region-custody-tab" class="tab-content admin-tabs">
                        <div class="section-divider">
                            <span class="icon">📍</span>
                            متابعة عُهد المناطق
                        </div>
                        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                            <button class="btn btn-primary" onclick="loadRegionCustody()">تحديث البيانات</button>
                        </div>
                        <div id="region-custody-content"></div>
                        <div class="section-divider">استهلاك المناديب من العهدة المركزية للمنطقة</div>
                        <div id="courier-region-usage-content"></div>
                    </div>

                    <div id="inventory-reg-tab" class="tab-content admin-tabs">
                        <div class="help-box">عدل رصيد المخزون الأساسي لكل الأنواع في نفس الوقت. سيقوم النظام بضبط الفروقات تلقائياً.</div>
                        <div class="card">
                            <h2 class="card-title">تعديل المخزون الأساسي</h2>
                            <form id="update-inventory-form" onsubmit="handleUpdateInventory(event)">
                                <div class="products-grid" id="inv-adj-container">
                                    ${PRODUCTS.map((p, i) => `
                                        <div class="form-group product-card">
                                            <label class="form-label">${p}</label>
                                            <input type="number" id="inv-adj-${i}" class="form-input" value="0" required>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="form-group" style="margin-top: 15px;">
                                    <label class="form-label">سبب التعديل</label>
                                    <textarea id="inv-adj-reason" class="form-textarea" placeholder="اذكر سبب التعديل (اختياري)"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">حفظ التعديلات</button>
                            </form>
                        </div>
                    </div>

                    <div id="needs-tab" class="tab-content admin-tabs">
                        <div class="help-box">تسجيل احتياجات المصنع لإرسالها للإنتاج</div>
                        <div class="card" style="margin-bottom: 20px;">
                            <h2 class="card-title">تسجيل احتياج جديد</h2>
                            <form id="create-needs-form" onsubmit="handleCreateNeeds(event)">
                                <div class="products-grid">
                                    ${PRODUCTS.map((p, i) => `
                                        <div class="form-group product-card">
                                            <label class="form-label">${p}</label>
                                            <input type="number" class="form-input need-input" data-product="${p}" min="0" value="0" required>
                                        </div>
                                    `).join('')}
                                </div>
                                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 15px;">تسجيل الاحتياجات</button>
                            </form>
                        </div>

                        <div class="section-divider">
                            <span class="icon">📊</span>
                            سجل الاحتياجات
                        </div>
                        <div style="margin-bottom: 15px;">
                            <button class="btn btn-primary" onclick="loadNeeds()">تحديث البيانات</button>
                        </div>
                        <div id="needs-overview-container" class="table-wrapper">
                            <!-- Needs overview will load here -->
                        </div>
                    </div>

                    <div id="inventory-tab" class="tab-content admin-tabs">
                        <div class="help-box">تفاصيل حركة المخزون لكل منتج</div>
                        <div class="card">
                            <div class="table-wrapper" id="inventory-content"></div>
                        </div>
                    </div>

                    <div id="delegates-tab" class="tab-content admin-tabs">
                        <div class="help-box">عرض عهدة كل مندوب</div>
                        <div class="card">
                            <div class="table-wrapper" id="delegates-content"></div>
                        </div>
                    </div>

                    <div id="delegate-report-tab" class="tab-content admin-tabs">
                        <div class="help-box">متابعة طلبات الدفع عند الاستلام والعهد الإضافية لكل مندوب</div>
                        <div class="card" style="margin-bottom: 20px;">
                            <div class="form-group" style="max-width: 400px;">
                                <label>اختر المندوب:</label>
                                <select id="report-delegate-select" onchange="renderDelegateReport(this.value)" class="form-input">
                                    <option value="">جاري التحميل...</option>
                                </select>
                                <button onclick="printDelegateReport()" class="btn btn-primary" style="margin-top: 15px;">طباعة التقرير (PDF)</button>
                            </div>
                        </div>
                        <div id="delegate-report-content">
                            <!-- Report content will load here -->
                        </div>
                    </div>

                    <div id="logs-tab" class="tab-content admin-tabs">
                        <div class="card">
                            <div class="table-wrapper" id="logs-content"></div>
                        </div>
                    </div>

                    <div id="settings-tab" class="tab-content admin-tabs">
                        <div class="help-box">إدارة الأقسام وإضافة المندوبين للنظام</div>
                        
                        <div class="card" style="margin-bottom: 20px;">
                            <h2 class="card-title">إدارة المناطق</h2>
                            <form onsubmit="handleAddRegion(event)" style="margin-bottom: 15px;">
                                <div class="products-grid">
                                    <div class="form-group">
                                        <label class="form-label">اسم المنطقة الجديدة</label>
                                        <input type="text" id="new-region-name" class="form-input" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 100%; max-width: 200px; margin: 15px auto 0; display: block;">إضافة منطقة</button>
                            </form>
                            <div id="regions-list"></div>
                        </div>

                        <div class="card" style="margin-bottom: 20px;">
                            <h2 class="card-title">إضافة مندوب جديد</h2>
                            <form id="add-delegate-form" onsubmit="handleAddDelegate(event)">
                                <div class="products-grid">
                                    <div class="form-group">
                                        <label class="form-label">اسم المندوب</label>
                                        <input type="text" id="new-delegate-name" class="form-input" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">المنطقة</label>
                                        <select id="new-delegate-region" class="form-select" required>
                                            <option value="">-- اختر المنطقة --</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 100%; max-width: 200px; margin: 15px auto 0; display: block;">إضافة المندوب</button>
                            </form>
                            <div id="delegates-list" style="margin-top: 15px;"></div>
                        </div>

                        <div class="card">
                            <h2 class="card-title">إدارة كلمات المرور للأقسام</h2>
                            <div class="table-wrapper" id="users-passwords-content">
                                <!-- Users list will load here -->
                            </div>
                        </div>
                    </div>

                    <div id="assignment-tab" class="tab-content admin-tabs">
                        <div class="help-box">سجّل طلبية جديدة لسحب كميات من المخزون. أدخل رقم الطلبية والكميات المطلوبة من كل نوع</div>
                        <div class="card">
                            <h2 class="card-title">إسناد طلبية جديدة</h2>
                            <form id="assignment-form" onsubmit="handleOrderAssignment(event)">
                                <div class="form-group">
                                    <label class="form-label">رقم الطلبية</label>
                                    <input type="text" id="assignment-order-num" class="form-input" required placeholder="أدخل رقم الطلبية">
                                </div>
                                <div class="products-grid">
                                    ${PRODUCTS.filter(p => p !== 'بارات الومنيوم').map((p, i) => `
                                        <div class="form-group product-card">
                                            <label class="form-label">${p}</label>
                                            <input type="number" id="assign-qty-${i}" class="form-input" min="0" value="0" required>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="form-group">
                                    <label class="form-label">ملاحظات (السحب تبع إيه)</label>
                                    <textarea id="assignment-notes" class="form-textarea" placeholder="مثال: سحب لتوزيع منطقة الرياض"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">تأكيد إسناد الطلبية</button>
                            </form>
                        </div>
                        <div class="card" style="margin-top: 20px;">
                            <h2 class="card-title">سجل الطلبيات المسندة</h2>
                            <div id="assignments-history"></div>
                        </div>
                    </div>

                    <div id="financial-tracking-tab" class="tab-content admin-tabs">
                        <div class="help-box">متابعة مالية وحالة الفرز والمصنع</div>
                        <div class="card" style="margin-bottom: 20px;">
                            <div class="form-group" style="max-width: 400px;">
                                <label>تصفية باسم المندوب:</label>
                                <select id="financial-filter" onchange="filterFinancialData()" class="form-input">
                                    <option value="">-- كل المناديب --</option>
                                </select>
                            </div>
                        </div>
                        <div id="financial-tracking-content"></div>
                    </div>

                    <div id="extra-stats-tab" class="tab-content admin-tabs">
                        <div class="help-box">إحصائيات العهدة الإضافية</div>
                        <div id="extra-stats-content"></div>
                    </div>
                </main>
            `;
            document.getElementById('app').innerHTML = html;
            loadDashboard();
        }

        async function loadDashboard() {
            const container = document.getElementById('dashboard-content');
            container.innerHTML = renderLoadingOverlay();
            const res = await API.get('dashboard', {role: 'admin'});
            if (!res.ok) {
                container.innerHTML = `<div class="help-box" style="background-color: #ffebee; color: #c62828;">${res.error}</div>`;
                return;
            }

            const data = res.data;
            const inventory = data.inventory || {};
            let totalInventory = 0;
            const productsHtml = PRODUCTS.map(p => {
                const bal = inventory[p] || 0;
                totalInventory += bal;
                const isNegative = bal < 0;
                return `
                    <div class="product-card">
                        <h3>${p}</h3>
                        <p style="font-size: 24px; font-weight: bold; margin-top: 10px; ${isNegative ? 'color: #dc2626;' : ''}">${formatNumber(bal)}</p>
                    </div>
                `;
            }).join('');

            const statsHtml = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">المرتجع</div>
                        <div class="stat-value">${formatNumber(data.totalReturned || 0)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">التالف</div>
                        <div class="stat-value">${formatNumber(data.totalDamaged || 0)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">التحصيل</div>
                        <div class="stat-value">${formatNumber(data.totalCollected || 0)}</div>
                    </div>
                </div>
                
                <h2 style="margin: 20px 0 10px;">رصيد المنتجات</h2>
                <div class="products-grid">
                    ${productsHtml}
                </div>
            `;

            const overviewRes = await API.get('factory_overview');
            let needsHtml = '';
            
            if (overviewRes && overviewRes.ok && overviewRes.data && overviewRes.data.length > 0) {
                const overviewCards = overviewRes.data.map(item => `
                    <div class="product-card" style="margin-bottom: 20px;">
                        <h3 class="card-title" style="margin-bottom: 5px;">${item.product}</h3>
                        <div style="font-size: 0.9em; color: #666; margin-bottom: 15px;">إجمالي مطلوب: ${item.originalNeed}</div>
                        <div class="stats-grid">
                            <div class="stat-card" style="border-right: 4px solid #2563eb;">
                                <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">إجمالي الاحتياج</div>
                                <strong style="font-size: 1.2em; color: ${item.needToOrder < 0 ? '#dc2626' : '#2563eb'};">${formatNumber(item.needToOrder)}</strong>
                            </div>
                            <div class="stat-card" style="border-right: 4px solid #d97706;">
                                <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">تم الطلب من المصنع</div>
                                <strong style="font-size: 1.2em; color: ${item.pendingDelivery < 0 ? '#dc2626' : '#d97706'};">${formatNumber(item.pendingDelivery)}</strong>
                            </div>
                            <div class="stat-card" style="border-right: 4px solid #059669;">
                                <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">تم الاستلام</div>
                                <strong style="font-size: 1.2em; color: #059669;">${formatNumber(item.totalReceived)}</strong>
                            </div>
                            <div class="stat-card" style="border-right: 4px solid #dc2626;">
                                <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">المتبقي</div>
                                <strong style="font-size: 1.2em; color: ${item.remaining < 0 ? '#dc2626' : '#dc2626'};">${formatNumber(item.remaining)}</strong>
                            </div>
                        </div>
                    </div>
                `).join('');

                needsHtml = `
                    <h2 style="margin: 20px 0 10px;">احتياجات المصنع الحالية</h2>
                    <div class="products-grid">
                        ${overviewCards}
                    </div>
                `;
            } else {
                needsHtml = `
                    <h2 style="margin: 20px 0 10px;">احتياجات المصنع الحالية</h2>
                    <div class="help-box">لا توجد احتياجات مسجلة حالياً</div>
                `;
            }

            container.innerHTML = statsHtml + needsHtml;
        }

        async function handleUpdateInventory(e) {
            e.preventDefault();
            const items = [];
            PRODUCTS.forEach((p, i) => {
                const newBalance = Number(document.getElementById('inv-adj-' + i).value);
                items.push({ product: p, newBalance: newBalance });
            });

            const reason = document.getElementById('inv-adj-reason')?.value || '';

            showLoading();
            const res = await API.post('update_inventory', { items, reason });
            hideLoading();

            if (res && res.ok) {
                showToast('تم حفظ التعديلات بنجاح', 'success');
                loadDashboard();
            } else {
                showToast(res?.error || 'حدث خطأ أثناء التعديل', 'error');
            }
        }

        async function loadInventoryAdjustment() {
            showLoading();
            const res = await API.get('inventory');
            hideLoading();
            if (res && res.ok && res.data) {
                PRODUCTS.forEach((p, i) => {
                    const item = res.data.find(d => d.product === p);
                    if (item) {
                        document.getElementById('inv-adj-' + i).value = item.balance;
                    }
                });
            }
        }

        async function handleCreateNeeds(e) {
            e.preventDefault();
            const items = [];
            document.querySelectorAll('.need-input').forEach(input => {
                const qty = parseInt(input.value, 10);
                if (qty > 0) {
                    items.push({product: input.dataset.product, quantity: qty});
                }
            });

            if (items.length === 0) {
                showToast('الرجاء إدخال كمية لمنتج واحد على الأقل', 'error');
                return;
            }

            showLoading();
            const res = await API.post('create_need', {items});
            hideLoading();

            if (res.ok) {
                showToast('تم تسجيل الاحتياجات بنجاح');
                document.querySelectorAll('.need-input').forEach(inp => inp.value = 0);
                loadNeeds();
            } else {
                showToast(res.error || 'حدث خطأ', 'error');
            }
        }

        async function loadNeeds() {
            const container = document.getElementById('needs-overview-container');
            container.innerHTML = renderLoadingOverlay();
            const res = await API.get('factory_needs');
            
            if (!res.ok) {
                container.innerHTML = `<div style="color: red;">${res.error}</div>`;
                return;
            }

            if (!res.data || res.data.length === 0) {
                container.innerHTML = renderEmpty('لا توجد احتياجات مسجلة حالياً');
                return;
            }

            const html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>المنتج</th>
                            <th>المطلوب</th>
                            <th>المستلم</th>
                            <th>المتبقي</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${res.data.map(n => `
                            <tr>
                                <td>${formatDate(n.date || n.timestamp)}</td>
                                <td>${n.product}</td>
                                <td>${n.required}</td>
                                <td>${n.received}</td>
                                <td>${n.remaining}</td>
                                <td><span class="badge">${n.status}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }

        async function loadInventory() {
            const container = document.getElementById('inventory-content');
            container.innerHTML = renderLoadingOverlay();
            const res = await API.get('inventory');
            
            if (!res.ok) {
                container.innerHTML = `<div style="color: red;">${res.error}</div>`;
                return;
            }

            if (!res.data || res.data.length === 0) {
                container.innerHTML = renderEmpty('لا توجد بيانات للمخزون');
                return;
            }

            const html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>المنتج</th>
                            <th>الوارد</th>
                            <th>المرتجع</th>
                            <th>المصروف</th>
                            <th>التالف</th>
                            <th>الرصيد</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${res.data.map(i => `
                            <tr>
                                <td><strong>${i.product}</strong></td>
                                <td>${i.totalIn || 0}</td>
                                <td>${i.totalReturn || 0}</td>
                                <td>${i.totalOut || 0}</td>
                                <td>${i.totalDamaged || 0}</td>
                                <td style="font-weight:bold;">${i.balance || 0}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            container.innerHTML = html;
        }

        async function loadDelegates() {
            const container = document.getElementById('delegates-content');
            container.innerHTML = renderLoadingOverlay();
            const res = await API.get('all_delegates');
            
            if (!res.ok) {
                container.innerHTML = `<div style="color: red;">${res.error}</div>`;
                return;
            }

            if (!res.data || res.data.length === 0) {
                container.innerHTML = renderEmpty('لا يوجد مندوبين');
                return;
            }

            let html = '';
            res.data.forEach(del => {
                html += `
                    <h3 style="margin: 20px 0 10px; color: var(--primary);">${del.delegate} <small style="color:#666;">(${del.region})</small></h3>
                    <table class="data-table" style="margin-bottom: 20px;">
                        <thead>
                            <tr>
                                <th>المنتج</th>
                                <th>رصيد الطلبات</th>
                                <th>الرصيد الإضافي</th>
                                <th>إجمالي الرصيد</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${del.balances && del.balances.length > 0 ? del.balances.map(b => `
                                <tr>
                                    <td>${b.product}</td>
                                    <td>${b.orderBalance || 0}</td>
                                    <td>${b.extraBalance || 0}</td>
                                    <td style="font-weight:bold;">${b.totalBalance || 0}</td>
                                </tr>
                            `).join('') : '<tr><td colspan="4" style="text-align:center;">لا يوجد رصيد</td></tr>'}
                        </tbody>
                    </table>
                `;
            });

            container.innerHTML = html;
        }

        async function loadLogs() {
            const container = document.getElementById('logs-content');
            container.innerHTML = renderLoadingOverlay();
            const res = await API.get('transactions', {limit: '200'});
            
            if (!res.ok) {
                container.innerHTML = `<div style="color: red;">${res.error}</div>`;
                return;
            }

            if (!res.data || res.data.length === 0) {
                container.innerHTML = renderEmpty('لا توجد عمليات');
                return;
            }

            const html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>نوع الحركة</th>
                            <th>المنتج</th>
                            <th>الكمية</th>
                            <th>من</th>
                            <th>إلى</th>
                            <th>رقم الطلب</th>
                            <th>المستخدم</th>

        async function handleOrderAssignment(e) {
            e.preventDefault();
            const orderNumber = document.getElementById('assignment-order-num').value.trim();
            const items = [];
            const assignProducts = PRODUCTS.filter(p => p !== 'بارات الومنيوم');
            assignProducts.forEach((p, i) => {
                const qty = Number(document.getElementById('assign-qty-' + i).value);
                if (qty > 0) items.push({ product: p, quantity: qty });
            });
            const notes = document.getElementById('assignment-notes').value;

            if (!orderNumber) {
                showToast('يرجى إدخال رقم الطلبية', 'error');
                return;
            }
            if (items.length === 0) {
                showToast('يجب تحديد كمية لنوع واحد على الأقل', 'error');
                return;
            }

            showLoading();
            const res = await API.post('order_assignment', { orderNumber, items, notes });
            hideLoading();

            if (res && res.ok) {
                showToast(res.message || 'تم إسناد الطلبية بنجاح', 'success');
                e.target.reset();
                loadAssignments();
                loadDashboard();

                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>المنطقة</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                        <tbody>
                            ${regions.map(r => `
                                <tr>
                                    <td>${r.name}</td>
                                    <td><span class="badge ${r.status === 'نشطة' ? 'badge-success' : 'badge-danger'}">${r.status}</span></td>
                                    <td>
                                        <button class="btn btn-outline" onclick="toggleRegion(${r.index}, '${r.status === 'نشطة' ? 'معطلة' : 'نشطة'}')" style="padding: 4px 10px; font-size: 0.85em;">
                                            ${r.status === 'نشطة' ? 'تعطيل' : 'تفعيل'}
                                        </button>
                                        <button class="btn btn-danger" onclick="deleteRegion(${r.index}, '${r.name}')" style="padding: 4px 10px; font-size: 0.85em; margin-right: 5px;">حذف</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function handleAddRegion(e) {
            e.preventDefault();
            const name = document.getElementById('new-region-name').value.trim();
            if (!name) return showToast('يرجى إدخال اسم المنطقة', 'error');
            showLoading();
            const res = await API.post('add_region', { name });
            hideLoading();
            if (res && res.ok) {
                showToast('تمت إضافة المنطقة بنجاح', 'success');
                document.getElementById('new-region-name').value = '';
                loadRegions();
            } else {
                showToast(res?.error || 'خطأ في إضافة المنطقة', 'error');
            }
        }

        async function toggleRegion(index, newStatus) {
            showLoading();
            const res = await API.post('toggle_region', { index, status: newStatus });
            hideLoading();
            if (res && res.ok) {
                showToast('تم تحديث حالة المنطقة', 'success');
                loadRegions();
            } else {
                showToast(res?.error || 'خطأ', 'error');
            }
        }

        async function deleteRegion(index, name) {
            if (!confirm('هل أنت متأكد من حذف المنطقة: ' + name + '؟')) return;
            showLoading();
            const res = await API.post('delete_region', { index });
            hideLoading();
            if (res && res.ok) {
                showToast('تم حذف المنطقة', 'success');
                loadRegions();
            } else {
                showToast(res?.error || 'خطأ في حذف المنطقة', 'error');
            }
        }

        // ==========================================
        // إدارة المندوبين (مع الحذف)
        // ==========================================

        async function loadDelegatesList() {
            const container = document.getElementById('delegates-list');
            if (!container) return;
            const res = await API.get('all_couriers');
            if (!res || !res.ok) {
                container.innerHTML = '<div class="help-box" style="background-color: #ffebee;">خطأ في تحميل المندوبين</div>';
                return;
            }
            const couriers = res.data || [];
            if (couriers.length === 0) {
                container.innerHTML = renderEmpty('لا يوجد مندوبين');
                return;
            }
            container.innerHTML = `
                <h3 style="margin: 15px 0 10px;">قائمة المندوبين</h3>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>الاسم</th><th>المنطقة</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                        <tbody>
                            ${couriers.map(c => `
                                <tr style="${c.status === 'محذوف' ? 'opacity: 0.5;' : ''}">
                                    <td>${c.displayName}</td>
                                    <td>${c.region}</td>
                                    <td><span class="badge ${c.status === 'محذوف' ? 'badge-danger' : 'badge-success'}">${c.status || 'نشط'}</span></td>
                                    <td>
                                        ${c.status !== 'محذوف' ? `<button class="btn btn-danger" onclick="deleteDelegate('${c.displayName.replace(/'/g, "\\'")}')" style="padding: 4px 10px; font-size: 0.85em;">حذف</button>` : '<span style="color:#999;">محذوف</span>'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function deleteDelegate(name) {
            if (!confirm('هل أنت متأكد من حذف المندوب: ' + name + '؟\\n\\nسيتم الاحتفاظ بالسجلات التاريخية.')) return;
            showLoading();
            const res = await API.post('delete_delegate', { name });
            hideLoading();
            if (res && res.ok) {
                showToast('تم حذف المندوب بنجاح', 'success');
                loadDelegatesList();
            } else {
                showToast(res?.error || 'خطأ في حذف المندوب', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
