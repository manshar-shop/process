<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفرز والتوزيع - منشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app"></div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    
    <script>
        const session = Auth.requireRole('distribution');
        let delegates = [];

        async function init() {
            showLoading();
            await fetchDelegates();
            hideLoading();
            render();
        }

        async function fetchDelegates() {
            try {
                const res = await API.get('all_delegates');
                if (res.ok) {
                    delegates = res.data;
                } else {
                    showToast(res.error || 'حدث خطأ في تحميل المناديب', 'error');
                }
            } catch (err) {
                showToast('حدث خطأ في الاتصال', 'error');
            }
        }

        function getDelegateOptionsHTML() {
            const uniqueMap = new Map();
            delegates.forEach(d => {
                if (!uniqueMap.has(d.delegate)) {
                    uniqueMap.set(d.delegate, d);
                }
            });
            const unique = Array.from(uniqueMap.values());
            return `<option value="">-- اختر المندوب --</option>` + 
                   unique.map(d => `<option value="${d.delegate}">${d.delegate} (${d.region})</option>`).join('');
        }
        
        function getProductsOptionsHTML() {
            return `<option value="">-- اختر المنتج --</option>` + PRODUCTS.map(p => `<option value="${p}">${p}</option>`).join('');
        }

        function render() {
            const header = renderHeader('إدارة الفرز والتوزيع', 'توزيع العهد على المناديب وإدارة المرتجعات');
            
            const tabsHTML = `
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('tab-extra')">عهدة إضافية</button>
                    <button class="tab-btn" onclick="switchTab('tab-region-custody')">عهدة المناطق</button>
                    <button class="tab-btn" onclick="switchTab('tab-damaged')">تسجيل تالف</button>
                    <button class="tab-btn" onclick="switchTab('financial-dist-tab'); loadFinancialDist()">مراجعة التحصيلات</button>
                    <button class="tab-btn" onclick="switchTab('tab-inventory'); renderInventoryTab()">عهد المناديب</button>
                </div>
            `;

            const delegateOptions = getDelegateOptionsHTML();
            const productsOptions = getProductsOptionsHTML();

            const extraTab = `
                <div id="tab-extra" class="tab-content dist-tabs active">
                    <div class="card">
                        <div class="card-header"><h2 class="card-title">إضافة عهدة إضافية</h2></div>
                        <div class="help-box">عهدة إضافية للمندوب بدون طلبات. يمكن استخدامها في إضافات التركيب</div>
                        <form onsubmit="handleExtraSubmit(event)">
                            <div class="form-group">
                                <label class="form-label">اسم المندوب</label>
                                <select id="extra-delegate" class="form-select" required>
                                    ${delegateOptions}
                                </select>
                            </div>
                            <div class="products-grid">
                                ${PRODUCTS.filter(p => p !== 'بارات الومنيوم').map((p, i) => `
                                    <div class="form-group product-card">
                                        <label class="form-label">${p}</label>
                                        <input type="number" id="extra-qty-${i}" class="form-input" min="0" value="0" required>
                                    </div>
                                `).join('')}
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">حفظ العهدة الإضافية</button>
                        </form>
                    </div>
                </div>
            `;

            const damagedTab = `
                <div id="tab-damaged" class="tab-content dist-tabs">
                    <div class="card">
                        <div class="card-header"><h2 class="card-title">تسجيل تالف</h2></div>
                        <div class="help-box">التالف ينقص من عهدة المندوب ولا يعود للمخزون. يظهر للمصنع كمرتجعات تالفة</div>
                        <form onsubmit="handleDamagedSubmit(event)">
                            <div class="form-group">
                                <label class="form-label">نوع المنشر</label>
                                <select id="damaged-product" class="form-select" required>
                                    ${productsOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">الكمية</label>
                                <input type="number" id="damaged-qty" class="form-input" min="1" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">مصدر التلف</label>
                                <select id="damaged-source" class="form-select" required>
                                    <option value="">-- اختر مصدر التلف --</option>
                                    <option value="من المصنع">من المصنع</option>
                                    <option value="من العميل">من العميل</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">تفاصيل إضافية</label>
                                <input type="text" id="damaged-reason" class="form-input">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">تسجيل التالف</button>
                        </form>
                    </div>
                </div>
            `;

            const financialTab = `
                <div id="financial-dist-tab" class="tab-content dist-tabs">
                    <div class="card">
                        <div class="card-header"><h2 class="card-title">مراجعة التحصيلات</h2></div>
                        <div class="help-box">مراجعة وتأكيد المبالغ المحصلة من المناديب قبل إرسالها للمصنع</div>
                        <div id="financial-dist-stats" style="margin-bottom: 15px; font-weight: bold;"></div>
                        <div id="financial-dist-content"></div>
                    </div>
                </div>
            `;

            const inventoryTab = `
                <div id="tab-inventory" class="tab-content dist-tabs">
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">عهد المناديب الحالية</h2>
                            <button class="btn btn-primary" onclick="renderInventoryTab()" style="width: auto;">تحديث</button>
                        </div>
                        <div class="help-box">عرض رصيد كل مندوب من المنتجات</div>
                        <div id="inventory-content"></div>
                    </div>
                </div>
            `;

            const regionCustodyTab = `
                <div id="tab-region-custody" class="tab-content dist-tabs">
                    <div class="help-box">
                        إدارة عهد المناطق. صرف العهدة للمنطقة ككل يخصم تلقائياً بارات الألومنيوم للمنتجات التي تحتاجه.
                    </div>
                    
                    <div class="card" style="margin-bottom: 24px;">
                        <div class="card-header"><h2 class="card-title">صرف عهدة للمنطقة</h2></div>
                        <form onsubmit="handleRegionCustodyAdd(event)">
                            <div class="form-group">
                                <label class="form-label">المنطقة</label>
                                <select id="rc-add-region" class="form-select" required>
                                    <option value="">-- اختر المنطقة --</option>
                                    <option value="الشرقية">الشرقية</option>
                                    <option value="الغربيه">الغربية</option>
                                </select>
                            </div>
                            <div class="products-grid">
                                ${PRODUCTS.filter(p => p !== 'بارات الومنيوم').map((p, i) => `
                                    <div class="form-group product-card">
                                        <label class="form-label">${p}</label>
                                        <input type="number" id="rc-add-qty-${i}" class="form-input" min="0" value="0" required>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="form-group">
                                <label class="form-label">ملاحظات (اختياري)</label>
                                <input type="text" id="rc-add-notes" class="form-input">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">صرف العهدة للمنطقة</button>
                        </form>
                    </div>

                    <div class="card">
                        <div class="card-header"><h2 class="card-title">إرجاع عهدة من المنطقة</h2></div>
                        <form onsubmit="handleRegionCustodyReturn(event)">
                            <div class="form-group">
                                <label class="form-label">المنطقة</label>
                                <select id="rc-ret-region" class="form-select" required>
                                    <option value="">-- اختر المنطقة --</option>
                                    <option value="الشرقية">الشرقية</option>
                                    <option value="الغربيه">الغربية</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">المندوب المُسلِّم (اختياري)</label>
                                <select id="rc-ret-delegate" class="form-select">
                                    ${delegateOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">المنتج</label>
                                <select id="rc-ret-product" class="form-select" required>
                                    <option value="">-- اختر المنتج --</option>
                                    ${PRODUCTS.filter(p => p !== 'بارات الومنيوم').map(p => `<option value="${p}">${p}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">الكمية المسترجعة</label>
                                <input type="number" id="rc-ret-qty" class="form-input" min="1" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">ملاحظات (اختياري)</label>
                                <input type="text" id="rc-ret-notes" class="form-input">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">تسجيل المرتجع للمخزون</button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = `
                ${header}
                <div class="container" style="padding: 20px;">
                    ${tabsHTML}
                    ${extraTab}
                    ${regionCustodyTab}
                    ${damagedTab}
                    ${financialTab}
                    ${inventoryTab}
                </div>
            `;
        }

        async function handleSortSubmit(e) {
            e.preventDefault();
            const delegate = document.getElementById('sort-delegate').value;
            const items = [];
            
            PRODUCTS.forEach((p, i) => {
                const qty = Number(document.getElementById('sort-qty-' + i).value);
                if (qty > 0) items.push({ product: p, quantity: qty });
            });
            const orderNumber = document.getElementById('sort-order').value;

            if (items.length === 0) {
                showToast('يجب تحديد كمية لمنتج واحد على الأقل', 'error');
                return;
            }

            showLoading();
            const res = await API.post('sort_to_delegate', { delegate, orderNumber, items });
            hideLoading();

            if (res.ok) {
                showToast('تم اعتماد الفرز بنجاح', 'success');
                e.target.reset();
            } else {
                showToast(res.error || 'حدث خطأ', 'error');
            }
        }

        async function handleExtraSubmit(e) {
            e.preventDefault();
            const delegate = document.getElementById('extra-delegate').value;
            const items = [];
            const extraProducts = PRODUCTS.filter(p => p !== 'بارات الومنيوم');
            extraProducts.forEach((p, i) => {
                const qty = Number(document.getElementById('extra-qty-' + i).value);
                if (qty > 0) items.push({ product: p, quantity: qty });
            });

            if (items.length === 0) {
                showToast('يجب تحديد كمية لمنتج واحد على الأقل', 'error');
                return;
            }

            showLoading();
            const res = await API.post('extra_custody', { delegate, items });
            hideLoading();
            
            if (res.ok) {
                showToast(res.message);
                e.target.reset();
            } else {
                showToast(res.error || 'حدث خطأ', 'error');
            }
        }

        async function handleReturnSubmit(e) {
            e.preventDefault();
            const delegate = document.getElementById('return-delegate').value;
            const product = document.getElementById('return-product').value;
            const quantity = parseInt(document.getElementById('return-qty').value, 10);
            const reason = document.getElementById('return-reason').value;
            
            showLoading();
            const res = await API.post('register_return', { delegate, product, quantity, reason });
            hideLoading();

            if (res.ok) {
                showToast('تم تسجيل المرتجع بنجاح', 'success');
                e.target.reset();
            } else {
                showToast(res.error || 'حدث خطأ', 'error');
            }
        }

        async function handleDamagedSubmit(e) {
            e.preventDefault();
            const product = document.getElementById('damaged-product').value;
            const quantity = parseInt(document.getElementById('damaged-qty').value, 10);
            const source = document.getElementById('damaged-source').value;
            const reason = document.getElementById('damaged-reason').value;
            
            if (!source) {
                showToast('يرجى تحديد مصدر التلف', 'error');
                return;
            }
            
            showLoading();
            const res = await API.post('register_damage_record', { product, quantity, source, reason });
            hideLoading();

            if (res.ok) {
                showToast('تم تسجيل التالف بنجاح', 'success');
                e.target.reset();
            } else {
                showToast(res.error || 'حدث خطأ', 'error');
            }
        }

        async function renderInventoryTab() {
            const container = document.getElementById('inventory-content');
            container.innerHTML = renderLoadingOverlay();
            
            await fetchDelegates();
            
            if (delegates.length === 0) {
                container.innerHTML = renderEmpty('لا توجد بيانات لعهد المناديب حالياً');
                return;
            }

            let html = '<div class="table-wrapper"><table class="data-table">';
            html += '<thead><tr><th>المندوب</th><th>المنطقة</th>';
            PRODUCTS.forEach(p => {
                html += `<th>${p}<br><small>(طلب/إضافي/إجمالي)</small></th>`;
            });
            html += '</tr></thead><tbody>';

            delegates.forEach(d => {
                html += `<tr>
                    <td><strong>${d.delegate}</strong></td>
                    <td>${d.region || '-'}</td>`;
                
                PRODUCTS.forEach(p => {
                    const bal = d.balances ? d.balances.find(b => b.product === p) : null;
                    if (bal) {
                        html += `<td dir="ltr" style="text-align: center;">${bal.orderBalance} / ${bal.extraBalance} / <strong>${bal.totalBalance}</strong></td>`;
                    } else {
                        html += `<td dir="ltr" style="text-align: center;">0 / 0 / <strong>0</strong></td>`;
                    }
                });
                
                html += `</tr>`;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        let financialDistData = [];
        let financialDistStats = { total: 0, reviewed: 0, pending: 0 };

        async function loadFinancialDist() {
            const container = document.getElementById('financial-dist-content');
            if (!container) return;
            container.innerHTML = renderLoadingOverlay();

            const res = await API.get('financial_pending_dist');
            
            if (res && res.ok) {
                financialDistData = res.data || [];
                financialDistStats = res.stats || { total: 0, reviewed: 0, pending: 0 };
                renderFinancialDist();
            } else {
                container.innerHTML = renderEmpty('حدث خطأ أثناء تحميل بيانات التحصيلات');
            }
        }

        function renderFinancialDist() {
            const container = document.getElementById('financial-dist-content');
            const statsContainer = document.getElementById('financial-dist-stats');
            if (!container) return;

            if (statsContainer) {
                statsContainer.innerHTML = `تم مراجعة ${financialDistStats.reviewed} طلبات | معلق ${financialDistStats.pending} طلبات`;
            }

            if (financialDistData.length === 0) {
                container.innerHTML = renderEmpty('لا توجد تحصيلات معلقة');
                return;
            }

            container.innerHTML = financialDistData.map((installerGroup, idx) => `
                <div class="card" style="margin-bottom: 15px; border: 1px solid #eee;">
                    <div class="card-header" style="cursor: pointer; background: #f8f9fa; padding: 10px;" onclick="toggleInstallerCardDist('dist-inst-${idx}')">
                        <h3 style="margin: 0;">${installerGroup.installer} - ${formatNumber(installerGroup.totalAmount)} ريال (${installerGroup.orders.length} طلبات)</h3>
                    </div>
                    <div id="dist-inst-${idx}" style="display: none; padding: 10px;">
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th><input type="checkbox" onchange="toggleAllCheckboxesDist('chk-group-dist-${idx}', this.checked)"></th>
                                        <th>رقم الطلب</th>
                                        <th>المبلغ</th>
                                        <th>طريقة الدفع</th>
                                        <th>النوع</th>
                                        <th>تاريخ الطلب</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${installerGroup.orders.map(order => `
                                        <tr>
                                            <td><input type="checkbox" class="chk-group-dist-${idx}" value="${order.id}"></td>
                                            <td>${order.orderNumber || '-'}</td>
                                            <td>${formatNumber(order.amount)}</td>
                                            <td><span class="badge" style="background: #17a2b8; color: white;">${order.payMethod || '-'}</span></td>
                                            <td><span class="badge" style="background: #6c757d; color: white;">${order.type || '-'}</span></td>
                                            <td>${order.date ? formatDate(order.date) : '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <button class="btn btn-primary" style="margin-top: 10px;" onclick="confirmFinancialDist('chk-group-dist-${idx}')">تأكيد المحدد</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleInstallerCardDist(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = el.style.display === 'none' ? 'block' : 'none';
            }
        }

        function toggleAllCheckboxesDist(className, isChecked) {
            document.querySelectorAll('.' + className).forEach(chk => chk.checked = isChecked);
        }

        async function confirmFinancialDist(className) {
            const checkboxes = document.querySelectorAll('.' + className + ':checked');
            const ids = Array.from(checkboxes).map(c => c.value);
            
            if (ids.length === 0) {
                showToast('يرجى تحديد طلب واحد على الأقل', 'error');
                return;
            }

            if (!confirm('هل أنت متأكد من تأكيد الطلبات المحددة؟')) return;

            showLoading();
            const res = await API.post('confirm_financial_dist', { ids });
            hideLoading();

            if (res && res.ok) {
                showToast('تم التأكيد بنجاح', 'success');
                loadFinancialDist();
            } else {
                showToast(res?.error || 'حدث خطأ أثناء التأكيد', 'error');
            }
        }

        async function handleRegionCustodyAdd(e) {
            e.preventDefault();
            const region = document.getElementById('rc-add-region').value;
            const notes = document.getElementById('rc-add-notes').value;
            
            const items = [];
            let i = 0;
            PRODUCTS.forEach(p => {
                if (p === 'بارات الومنيوم') return;
                const el = document.getElementById('rc-add-qty-' + i);
                if (el && Number(el.value) > 0) {
                    items.push({ product: p, quantity: Number(el.value) });
                }
                i++;
            });

            if (items.length === 0) {
                showToast('يرجى تحديد كمية لمنتج واحد على الأقل', 'error');
                return;
            }

            if (!confirm('سيتم صرف العهدة لمنطقة ' + region + '. هل تريد المتابعة؟')) return;

            showLoading();
            const res = await API.post('region_custody_add', { region, items, notes });
            hideLoading();

            if (res && res.ok) {
                showToast(res.message || 'تم صرف العهدة بنجاح', 'success');
                e.target.reset();
            } else {
                showToast(res?.error || 'حدث خطأ أثناء صرف العهدة', 'error');
            }
        }

        async function handleRegionCustodyReturn(e) {
            e.preventDefault();
            const region = document.getElementById('rc-ret-region').value;
            const delegate = document.getElementById('rc-ret-delegate').value;
            const product = document.getElementById('rc-ret-product').value;
            const quantity = document.getElementById('rc-ret-qty').value;
            const notes = document.getElementById('rc-ret-notes').value;

            if (!confirm('سيتم إرجاع ' + quantity + ' ' + product + ' من منطقة ' + region + '. هل تريد المتابعة؟')) return;

            showLoading();
            const res = await API.post('region_custody_return', { region, delegate, product, quantity, notes });
            hideLoading();

            if (res && res.ok) {
                showToast(res.message || 'تم إرجاع العهدة بنجاح', 'success');
                e.target.reset();
            } else {
                showToast(res?.error || 'حدث خطأ أثناء إرجاع العهدة', 'error');
            }
        }

        // Initialize page
        init();
    </script>
</body>
</html>
